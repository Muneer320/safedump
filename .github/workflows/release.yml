name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check that the tag matches the package version
        if: github.event_name == 'release'
        run: |
          VERSION=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          INIT=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('src/safedump/__init__.py').read()).group(1))")
          TYPES=$(python -c "import re; print(re.search(r'__version__ = \"(.+?)\"', open('src/safedump/_types.py').read()).group(1))")
          TAG="${GITHUB_REF_NAME#v}"
          echo "tag=$TAG pyproject=$VERSION __init__=$INIT _types=$TYPES"
          if [ "$TAG" != "$VERSION" ] || [ "$INIT" != "$VERSION" ] || [ "$TYPES" != "$VERSION" ]; then
            echo "::error::Release tag v$TAG does not match the package version $VERSION (bump pyproject.toml, __init__.py and _types.py first)"
            exit 1
          fi

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          attestations: false
